    <!-- 性能监控脚本 -->
    <script>
      // 性能监控
      if ('performance' in window) {
        window.addEventListener('load', () => {
          const navigation = performance.getEntriesByType('navigation')[0];
          if (navigation) {
            console.log('🚀 页面性能数据:');
            console.log('DOM内容加载时间:', navigation.domContentLoadedEventEnd - navigation.domContentLoadedEventStart, 'ms');
            console.log('页面完全加载时间:', navigation.loadEventEnd - navigation.loadEventStart, 'ms');
            console.log('总加载时间:', navigation.loadEventEnd - navigation.fetchStart, 'ms');
          }
        });
      }
    </script>
